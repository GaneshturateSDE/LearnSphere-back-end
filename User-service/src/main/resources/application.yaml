spring:
    application:
        name: payment-service
    datasource:
        url: jdbc:mysql://localhost:3306/learnsphere?useSSL=false&serverTimezone=UTC
        username: root
        password: root
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update   
        show-sql: true       
        properties:
            hibernate:
                format_sql: true
        database-platform: org.hibernate.dialect.MySQL8Dialect   
    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB  
server:
        port: 8081
security:
  basic:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: "*"