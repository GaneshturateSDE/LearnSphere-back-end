spring:
    application:
        name: course-service
    data:
        mongodb:
             uri: mongodb://localhost:27017/course-service

    servlet:
        multipart:
            enabled: true
            max-file-size: 10MB
            max-request-size: 10MB
server:
        port: 8082
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka
