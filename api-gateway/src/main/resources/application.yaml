server:
  port: 8085

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
               - id: user-service
                 uri: http://localhost:8081
                 predicates:
                      - Path=/api/users/**,/api/auth/**

               - id: course-service
                 uri: http://localhost:8082
                 predicates:
                      - Path=/api/courses/**

               - id: payment-service
                 uri: http://localhost:8083
                 predicates:
                      - Path=/api/payments/**
          globals:
              cors-Configurations:
                '[/**]':
                  allowedOrigins: "*"
                  allowedMethods:
                    - GET
                    - POST
                    - PUT
                    - DELETE
                    - OPTIONS
                  allowedHeaders:
                    - "*"
                  allowCredentials: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka




