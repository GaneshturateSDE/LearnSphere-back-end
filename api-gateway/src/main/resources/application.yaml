server:
  port: 8080   # Gateway runs on 8080, can change if needed

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Route to User Service
        - id: user-service
          uri: http://localhost:8081  # your user-service port
          predicates:
            - Path=/api/users/**

        # Route to Course Service
        - id: course-service
          uri: http://localhost:8082  # your course-service port
          predicates:
            - Path=/api/courses/**

        # Route to Payment Service
        - id: payment-service
          uri: http://localhost:8083  # your payment-service port
          predicates:
            - Path=/api/payments/**